<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Expense Tracker</title>

<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:Poppins,sans-serif; }

  body {
    background: linear-gradient(135deg,#0f172a,#1e293b);
    display:flex; justify-content:center; align-items:center;
    height:100vh; color:white;
  }

  .container {
    width:340px;
    background: rgba(255,255,255,0.05);
    backdrop-filter:blur(12px);
    padding:20px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
  }

  h2 { text-align:center; margin-bottom:10px; }

  .summary {
    display:flex;
    justify-content:space-between;
    margin:10px 0;
    text-align:center;
  }

  .card {
    flex:1;
    padding:10px;
    border-radius:10px;
    margin:5px;
  }

  .income { background:#22c55e33; }
  .expense { background:#ef444433; }

  input, select {
    width:100%;
    padding:10px;
    margin:5px 0;
    border:none;
    border-radius:8px;
    outline:none;
  }

  button {
    width:100%;
    padding:10px;
    background:#3b82f6;
    border:none;
    color:white;
    border-radius:8px;
    cursor:pointer;
    transition:0.3s;
  }

  button:hover { background:#2563eb; }

  ul {
    list-style:none;
    margin-top:10px;
    max-height:180px;
    overflow-y:auto;
  }

  li {
    background:rgba(255,255,255,0.1);
    margin:5px 0;
    padding:10px;
    border-radius:8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }

  .green { color:#22c55e; }
  .red { color:#ef4444; }

  .delete {
    cursor:pointer;
    margin-left:10px;
    color:red;
  }

</style>
</head>
<body>

<div class="container">
  <h2>💸 Expense Tracker</h2>

  <div class="summary">
    <div class="card income">
      <h4>Income</h4>
      <p id="income">₹0</p>
    </div>
    <div class="card expense">
      <h4>Expense</h4>
      <p id="expense">₹0</p>
    </div>
  </div>

  <h3 style="text-align:center;">Balance: ₹<span id="balance">0</span></h3>

  <input type="text" id="text" placeholder="Enter description">
  <input type="number" id="amount" placeholder="Enter amount">
  
  <select id="type">
    <option value="income">Income</option>
    <option value="expense">Expense</option>
  </select>

  <button onclick="addTransaction()">Add</button>

  <ul id="list"></ul>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

let transactions = JSON.parse(localStorage.getItem("transactions")) || [];

function addTransaction() {
  const text = document.getElementById("text").value;
  const amount = document.getElementById("amount").value;
  const type = document.getElementById("type").value;

  if (!text || !amount) {
    alert("Enter all details!");
    return;
  }

  const transaction = {
    id: Date.now(),
    text,
    amount: +amount,
    type
  };

  transactions.push(transaction);
  updateUI();
  saveData();

  document.getElementById("text").value = "";
  document.getElementById("amount").value = "";
}

function updateUI() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  let income = 0, expense = 0;

  transactions.forEach(t => {
    if (t.type === "income") income += t.amount;
    else expense += t.amount;

    const li = document.createElement("li");
    li.innerHTML = `
      ${t.text} 
      <span class="${t.type === 'income' ? 'green' : 'red'}">
        ${t.type === 'income' ? '+' : '-'}₹${t.amount}
      </span>
      <span class="delete">x</span>
    `;

    li.querySelector(".delete").addEventListener("click", () => {
      deleteTransaction(t.id);
    });

    list.appendChild(li);
  });

  document.getElementById("income").innerText = "₹" + income;
  document.getElementById("expense").innerText = "₹" + expense;
  document.getElementById("balance").innerText = income - expense;
}

function deleteTransaction(id) {
  transactions = transactions.filter(t => t.id !== id);
  updateUI();
  saveData();
}

function saveData() {
  localStorage.setItem("transactions", JSON.stringify(transactions));
}

window.addTransaction = addTransaction;

updateUI();

});
</script>

</body>
</html>
